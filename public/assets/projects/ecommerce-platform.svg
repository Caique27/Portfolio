<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="40" rx="8" fill="#1e293b" opacity="0.6"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <rect x="110" y="32" width="280" height="16" rx="4" fill="#334155" opacity="0.8"/>
  <rect x="680" y="30" width="80" height="20" rx="6" fill="#3b82f6" opacity="0.9"/>
  <!-- Main Store Layout -->
  <!-- Hero Banner -->
  <rect x="40" y="80" width="480" height="140" rx="12" fill="#1e293b"/>
  <rect x="60" y="105" width="220" height="24" rx="4" fill="#f8fafc" opacity="0.9"/>
  <rect x="60" y="137" width="160" height="12" rx="3" fill="#94a3b8" opacity="0.7"/>
  <rect x="60" y="165" width="100" height="30" rx="6" fill="url(#accent)"/>
  <!-- Hero illustration placeholder -->
  <circle cx="440" cy="150" r="45" fill="#0ea5e9" opacity="0.25"/>
  <rect x="410" y="125" width="60" height="50" rx="8" fill="#38bdf8" opacity="0.8"/>

  <!-- Cart / Summary panel -->
  <rect x="540" y="80" width="220" height="360" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="560" y="105" width="100" height="18" rx="4" fill="#f8fafc" opacity="0.9"/>
  <rect x="560" y="140" width="180" height="44" rx="8" fill="#0f172a"/>
  <circle cx="585" cy="162" r="14" fill="#3b82f6" opacity="0.3"/>
  <rect x="610" y="152" width="80" height="10" rx="2" fill="#cbd5e1"/>
  <rect x="610" y="167" width="50" height="8" rx="2" fill="#64748b"/>
  <rect x="560" y="194" width="180" height="44" rx="8" fill="#0f172a"/>
  <circle cx="585" cy="216" r="14" fill="#10b981" opacity="0.3"/>
  <rect x="610" y="206" width="70" height="10" rx="2" fill="#cbd5e1"/>
  <rect x="610" y="221" width="40" height="8" rx="2" fill="#64748b"/>
  <!-- Total -->
  <line x1="560" y1="260" x2="740" y2="260" stroke="#334155" stroke-width="1"/>
  <rect x="560" y="280" width="80" height="14" rx="3" fill="#94a3b8"/>
  <rect x="680" y="278" width="60" height="18" rx="3" fill="#10b981"/>
  <rect x="560" y="320" width="180" height="40" rx="8" fill="#6366f1"/>
  <rect x="600" y="333" width="100" height="14" rx="3" fill="#ffffff"/>
  <rect x="560" y="375" width="180" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="600" y="392" width="100" height="10" rx="2" fill="#22c55e"/>

  <!-- Product items grid -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="150" height="200" rx="10" fill="#1e293b"/>
    <rect x="15" y="15" width="120" height="100" rx="6" fill="#0f172a"/>
    <rect x="15" y="130" width="90" height="12" rx="3" fill="#f8fafc"/>
    <rect x="15" y="150" width="50" height="10" rx="2" fill="#38bdf8"/>
    <rect x="100" y="165" width="35" height="22" rx="4" fill="#3b82f6"/>
  </g>
  <g transform="translate(205, 240)">
    <rect x="0" y="0" width="150" height="200" rx="10" fill="#1e293b"/>
    <rect x="15" y="15" width="120" height="100" rx="6" fill="#0f172a"/>
    <rect x="15" y="130" width="100" height="12" rx="3" fill="#f8fafc"/>
    <rect x="15" y="150" width="45" height="10" rx="2" fill="#38bdf8"/>
    <rect x="100" y="165" width="35" height="22" rx="4" fill="#3b82f6"/>
  </g>
  <g transform="translate(370, 240)">
    <rect x="0" y="0" width="150" height="200" rx="10" fill="#1e293b"/>
    <rect x="15" y="15" width="120" height="100" rx="6" fill="#0f172a"/>
    <rect x="15" y="130" width="85" height="12" rx="3" fill="#f8fafc"/>

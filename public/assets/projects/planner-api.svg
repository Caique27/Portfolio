<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="plannerApiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#132135"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#plannerApiBg)"/>

  <rect x="25" y="20" width="750" height="40" rx="8" fill="#1e293b"/>
  <circle cx="50" cy="40" r="5" fill="#ef4444"/>
  <circle cx="68" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="45" fill="#94a3b8" font-size="13" font-family="monospace">Planner-API — Node.js Express &amp; MySQL Task Engine</text>

  <!-- Left: API Endpoints & Docker DB -->
  <g transform="translate(40, 80)">
    <rect width="340" height="365" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="bold">CRUD Task Operations</text>

    <g transform="translate(20, 60)">
      <rect width="300" height="38" rx="6" fill="#1e293b"/>
      <rect x="10" y="8" width="45" height="22" rx="4" fill="#10b981"/>
      <text x="18" y="23" fill="#ffffff" font-size="11" font-weight="bold">GET</text>
      <text x="68" y="24" fill="#f8fafc" font-size="12" font-family="monospace">/tasks</text>
    </g>

    <g transform="translate(20, 110)">
      <rect width="300" height="38" rx="6" fill="#1e293b"/>
      <rect x="10" y="8" width="52" height="22" rx="4" fill="#3b82f6"/>
      <text x="16" y="23" fill="#ffffff" font-size="11" font-weight="bold">POST</text>
      <text x="72" y="24" fill="#f8fafc" font-size="12" font-family="monospace">/tasks</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="300" height="38" rx="6" fill="#1e293b"/>
      <rect x="10" y="8" width="45" height="22" rx="4" fill="#f59e0b"/>
      <text x="18" y="23" fill="#000" font-size="11" font-weight="bold">PUT</text>
      <text x="68" y="24" fill="#f8fafc" font-size="12" font-family="monospace">/tasks/:id</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="300" height="38" rx="6" fill="#1e293b"/>
      <rect x="10" y="8" width="60" height="22" rx="4" fill="#ef4444"/>
      <text x="16" y="23" fill="#ffffff" font-size="11" font-weight="bold">DELETE</text>
      <text x="80" y="24" fill="#f8fafc" font-size="12" font-family="monospace">/tasks/:id</text>
    </g>

    <g transform="translate(20, 265)">
      <rect width="300" height="75" rx="8" fill="#1e293b"/>
      <text x="15" y="25" fill="#38bdf8" font-size="12" font-weight="bold">MySQL Docker Container</text>
      <text x="15" y="48" fill="#94a3b8" font-size="11">Deployed on cloud container with connection pooling</text>
    </g>
  </g>

  <!-- Right: Node.js Express Code Structure -->
  <g transform="translate(410, 80)">
    <rect width="350" height="365" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="bold">Controller &amp; Database Layer</text>

    <g transform="translate(20, 60)" font-family="monospace" font-size="12">
      <text x="0" y="20" fill="#f43f5e">router.post('/tasks', async (req, res) => {</text>
      <text x="15" y="45" fill="#e2e8f0">const { title, description, date } = req.body;</text>
      <text x="15" y="70" fill="#60a5fa">const query = 'INSERT INTO tasks SET ?';</text>
      <text x="15" y="95" fill="#e2e8f0">const [result] = await pool.execute(query, [task]);</text>
      <text x="15" y="125" fill="#10b981">res.status(201).json({ id: result.insertId });</text>
      <text x="0" y="150" fill="#f43f5e">});</text>

      <g transform="translate(0, 190)">
        <rect width="310" height="85" rx="8" fill="#1e293b"/>
        <text x="15" y="25" fill="#cbd5e1" font-size="11">Architecture: Express.js + MySQL + Docker</text>
        <text x="15" y="45" fill="#94a3b8" font-size="11">Powers task persistence for MyPlanner web client</text>
        <text x="15" y="65" fill="#34d399" font-size="11">CORS &amp; JSON BodyParser enabled</text>
      </g>
    </g>
  </g>
</svg>


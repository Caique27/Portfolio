<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#111d33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#cloudBg)"/>

  <!-- Top bar status -->
  <rect x="25" y="20" width="750" height="44" rx="8" fill="#1e293b"/>
  <circle cx="50" cy="42" r="6" fill="#10b981"/>
  <text x="68" y="47" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">cluster-prod-us-east-1 (Running)</text>
  <rect x="580" y="32" width="85" height="20" rx="4" fill="#0f172a"/>
  <text x="590" y="46" fill="#94a3b8" font-size="11" font-family="monospace">v2.14.0-stable</text>
  <rect x="675" y="30" width="85" height="24" rx="6" fill="#0284c7"/>
  <text x="690" y="46" fill="#ffffff" font-size="12" font-weight="600">Deploy Now</text>

  <!-- Pipeline Visual Stages -->
  <g transform="translate(25, 85)">
    <rect width="750" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="30" fill="#f8fafc" font-size="15" font-weight="bold">Continuous Delivery Pipeline #4089</text>
    <text x="30" y="48" fill="#64748b" font-size="12">Triggered via GitHub webhook • main branch</text>

    <!-- Stage 1: Build -->
    <g transform="translate(30, 68)">
      <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="22" cy="30" r="10" fill="#10b981" opacity="0.2"/>
      <text x="18" y="34" fill="#10b981" font-size="12">✓</text>
      <text x="40" y="26" fill="#f8fafc" font-size="13" font-weight="600">Compile &amp; Lint</text>
      <text x="40" y="44" fill="#64748b" font-size="11">42s • 0 warnings</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 185 98 L 215 98" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2: Test & Security -->
    <g transform="translate(225, 68)">
      <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="22" cy="30" r="10" fill="#10b981" opacity="0.2"/>
      <text x="18" y="34" fill="#10b981" font-size="12">✓</text>
      <text x="40" y="26" fill="#f8fafc" font-size="13" font-weight="600">Unit &amp; E2E Tests</text>
      <text x="40" y="44" fill="#64748b" font-size="11">1m 18s • 248 tests</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 380 98 L 410 98" stroke="#10b981" stroke-width="2"/>

    <!-- Stage 3: Containerize -->
    <g transform="translate(420, 68)">
      <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="22" cy="30" r="10" fill="#38bdf8" opacity="0.2"/>
      <text x="18" y="34" fill="#38bdf8" font-size="12">⚙</text>
      <text x="40" y="26" fill="#f8fafc" font-size="13" font-weight="600">Docker Image</text>
      <text x="40" y="44" fill="#38bdf8" font-size="11">Building layer 5/7...</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 575 98 L 605 98" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Stage 4: Deploy -->
    <g transform="translate(615, 68)">
      <rect width="115" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="30" r="10" fill="#334155"/>
      <text x="17" y="34" fill="#94a3b8" font-size="12">⏱</text>
      <text x="38" y="26" fill="#94a3b8" font-size="13" font-weight="600">K8s Rollout</text>
      <text x="38" y="44" fill="#64748b" font-size="11">Waiting...</text>
    </g>
  </g>

  <!-- Bottom: Pod health and latency monitor -->
  <g transform="translate(25, 255)">
    <rect width="365" height="200" rx="12" fill="#1e293b"/>
    <text x="25" y="30" fill="#f8fafc" font-size="15" font-weight="bold">Replica Pod Grid (12 Pods)</text>
    <text x="25" y="48" fill="#64748b" font-size="12">12 / 12 healthy • Zero crash loops</text>
    <!-- 12 pod boxes -->
    <g transform="translate(25, 65)">
      <!-- 4x3 grid -->
      <rect x="0" y="0" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="80" y="0" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="160" y="0" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="240" y="0" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>

      <rect x="0" y="45" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="80" y="45" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="160" y="45" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="240" y="45" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>

      <rect x="0" y="90" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="80" y="90" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="160" y="90" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="240" y="90" width="65" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    </g>
  </g>

  <g transform="translate(410, 255)">
    <rect width="365" height="200" rx="12" fill="#1e293b"/>
    <text x="25" y="30" fill="#f8fafc" font-size="15" font-weight="bold">p99 Latency &amp; Ingress Throughput</text>
    <text x="25" y="48" fill="#64748b" font-size="12">14.2 ms avg • 12,400 req/sec</text>

    <!-- Throughput bar chart -->
    <g transform="translate(25, 70)">
      <rect x="10" y="70" width="22" height="45" rx="4" fill="#38bdf8"/>
      <rect x="42" y="55" width="22" height="60" rx="4" fill="#38bdf8"/>
      <rect x="74" y="40" width="22" height="75" rx="4" fill="#38bdf8"/>
      <rect x="106" y="25" width="22" height="90" rx="4" fill="#0284c7"/>
      <rect x="138" y="35" width="22" height="80" rx="4" fill="#38bdf8"/>
      <rect x="170" y="20" width="22" height="95" rx="4" fill="#0284c7"/>
      <rect x="202" y="45" width="22" height="70" rx="4" fill="#38bdf8"/>
      <rect x="234" y="30" width="22" height="85" rx="4" fill="#0284c7"/>
      <rect x="266" y="15" width="22" height="100" rx="4" fill="#38bdf8"/>
      <rect x="298" y="20" width="22" height="95" rx="4" fill="#10b981"/>
    </g>
  </g>
</svg>


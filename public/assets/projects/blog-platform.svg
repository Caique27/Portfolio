<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="blogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#blogBg)"/>

  <!-- Window Header -->
  <rect x="25" y="20" width="750" height="40" rx="8" fill="#1f2937"/>
  <circle cx="50" cy="40" r="5" fill="#ef4444"/>
  <circle cx="68" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="40" r="5" fill="#10b981"/>
  <rect x="120" y="32" width="220" height="16" rx="4" fill="#374151"/>
  <rect x="670" y="28" width="85" height="24" rx="5" fill="#6366f1"/>

  <!-- Left: Markdown Editor Split -->
  <g transform="translate(25, 75)">
    <rect width="365" height="380" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <!-- Editor Tab bar -->
    <rect width="365" height="35" rx="8" fill="#1f2937"/>
    <text x="20" y="22" fill="#9ca3af" font-size="12" font-family="monospace">article.mdx (Editing)</text>

    <!-- Markdown syntax mock -->
    <g transform="translate(20, 55)" font-family="monospace" font-size="13">
      <text x="0" y="20" fill="#f43f5e"># Building Scalable Micro-Frontends</text>
      <text x="0" y="50" fill="#9ca3af">> Published on Oct 2026 by Dev</text>
      
      <text x="0" y="85" fill="#38bdf8">### 1. Architectural Motivation</text>
      <text x="0" y="115" fill="#e5e7eb">Modern distributed web architectures</text>
      <text x="0" y="135" fill="#e5e7eb">require isolation, independent deploys</text>
      <text x="0" y="155" fill="#e5e7eb">and autonomous domain boundaries.</text>
      
      <text x="0" y="195" fill="#a855f7">```typescript</text>
      <text x="0" y="220" fill="#e5e7eb">const <tspan fill="#60a5fa">federationConfig</tspan> = {</text>
      <text x="15" y="245" fill="#e5e7eb">name: <tspan fill="#34d399">"analyticsDashboard"</tspan>,</text>
      <text x="15" y="270" fill="#e5e7eb">remotes: { coreApp: <tspan fill="#34d399">"core@cdn"</tspan> }</text>
      <text x="0" y="295" fill="#e5e7eb">};</text>
      <text x="0" y="320" fill="#a855f7">```</text>
    </g>
  </g>

  <!-- Right: Live Rendered Article -->
  <g transform="translate(410, 75)">
    <rect width="365" height="380" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Preview Tab bar -->
    <rect width="365" height="35" rx="8" fill="#0f172a"/>
    <text x="20" y="22" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="bold">Live Preview</text>

    <!-- Rendered typography -->
    <g transform="translate(25, 55)">
      <!-- Tags -->
      <rect x="0" y="10" width="60" height="20" rx="10" fill="#6366f1" opacity="0.2"/>
      <text x="10" y="24" fill="#818cf8" font-size="10" font-weight="600">ARCHITECTURE</text>

      <rect x="70" y="10" width="50" height="20" rx="10" fill="#10b981" opacity="0.2"/>
      <text x="80" y="24" fill="#34d399" font-size="10" font-weight="600">NEXT.JS</text>

      <text x="0" y="65" fill="#f8fafc" font-size="20" font-weight="bold">Building Scalable Micro-Frontends</text>
      
      <!-- Author info -->
      <circle cx="15" cy="95" r="12" fill="#3b82f6"/>
      <text x="35" y="94" fill="#cbd5e1" font-size="12" font-weight="bold">Software Architect</text>
      <text x="35" y="108" fill="#64748b" font-size="10">5 min read • Verified publication</text>

      <!-- Paragraph lines -->
      <rect x="0" y="130" width="310" height="8" rx="2" fill="#cbd5e1"/>
      <rect x="0" y="148" width="280" height="8" rx="2" fill="#cbd5e1"/>
      <rect x="0" y="166" width="300" height="8" rx="2" fill="#cbd5e1"/>
      <rect x="0" y="184" width="220" height="8" rx="2" fill="#cbd5e1"/>

      <!-- Rendered Code block -->
      <rect x="0" y="210" width="315" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="225" r="3" fill="#ef4444"/>
      <circle cx="27" cy="225" r="3" fill="#f59e0b"/>
      <circle cx="39" cy="225" r="3" fill="#10b981"/>
      
      <text x="15" y="255" fill="#60a5fa" font-size="11" font-family="monospace">const federationConfig = {</text>
      <text x="30" y="275" fill="#34d399" font-size="11" font-family="monospace">name: "analyticsDashboard"</text>
      <text x="15" y="295" fill="#60a5fa" font-size="11" font-family="monospace">};</text>

      <!-- Interaction bar (Likes, comments) -->
      <g transform="translate(0, 320)">
        <rect width="60" height="24" rx="12" fill="#334155"/>
        <text x="20" y="16" fill="#f43f5e" font-size="12">❤️ 342</text>

        <rect x="70" width="60" height="24" rx="12" fill="#334155"/>
        <text x="88" y="16" fill="#38bdf8" font-size="12">💬 48</text>
      </g>
    </g>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#111d33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#cBg)"/>
  
  <rect x="25" y="20" width="750" height="40" rx="8" fill="#1e293b"/>
  <circle cx="50" cy="40" r="5" fill="#ef4444"/>
  <circle cx="68" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="45" fill="#94a3b8" font-size="13" font-family="monospace">indexer.c — Binary Search Tree &amp; Linked List in C</text>

  <!-- Left: Binary Search Tree Visualization -->
  <g transform="translate(40, 85)">
    <rect width="340" height="360" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="bold">Binary Search Tree (BST)</text>
    <text x="25" y="55" fill="#64748b" font-size="12">Alphabetical Node Indexing: O(log n)</text>

    <!-- Root Node -->
    <circle cx="170" cy="110" r="22" fill="#3b82f6"/>
    <text x="156" y="115" fill="#ffffff" font-size="12" font-weight="bold" font-family="monospace">"node"</text>

    <!-- Branches -->
    <line x1="155" y1="125" x2="95" y2="175" stroke="#334155" stroke-width="2"/>
    <line x1="185" y1="125" x2="245" y2="175" stroke="#334155" stroke-width="2"/>

    <!-- Left Child -->
    <circle cx="95" cy="185" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="82" y="190" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace">"data"</text>

    <!-- Right Child -->
    <circle cx="245" cy="185" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="232" y="190" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace">"tree"</text>

    <!-- Sub-branches -->
    <line x1="85" y1="200" x2="50" y2="245" stroke="#334155" stroke-width="1.5"/>
    <line x1="105" y1="200" x2="135" y2="245" stroke="#334155" stroke-width="1.5"/>

    <circle cx="50" cy="255" r="16" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="42" y="259" fill="#94a3b8" font-size="10" font-family="monospace">"c"</text>

    <circle cx="135" cy="255" r="16" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="122" y="259" fill="#94a3b8" font-size="10" font-family="monospace">"list"</text>
  </g>

  <!-- Right: C Source Code Execution Preview -->
  <g transform="translate(410, 85)">
    <rect width="350" height="360" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="bold">C Memory &amp; Pointer Management</text>
    
    <g transform="translate(25, 65)" font-family="monospace" font-size="12">
      <text x="0" y="20" fill="#f43f5e">typedef struct <tspan fill="#38bdf8">WordNode</tspan> {</text>
      <text x="15" y="45" fill="#e2e8f0">char *word;</text>
      <text x="15" y="70" fill="#e2e8f0">int count;</text>
      <text x="15" y="95" fill="#e2e8f0">int line_occurrences[100];</text>
      <text x="15" y="120" fill="#60a5fa">struct WordNode *left, *right;</text>
      <text x="0" y="145" fill="#f43f5e">} WordNode;</text>

      <text x="0" y="190" fill="#10b981">// In-order traversal outputs</text>
      <text x="0" y="210" fill="#10b981">// words sorted alphabetically</text>
      <text x="0" y="240" fill="#f59e0b">WordNode* insert(WordNode* root, char* w) {</text>
      <text x="15" y="265" fill="#e2e8f0">if (!root) return createNode(w);</text>
      <text x="0" y="290" fill="#f59e0b">}</text>
    </g>
  </g>
</svg>


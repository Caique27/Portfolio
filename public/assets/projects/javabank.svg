<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="javaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#17223b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#javaBg)"/>
  
  <rect x="25" y="20" width="750" height="40" rx="8" fill="#1e293b"/>
  <circle cx="50" cy="40" r="5" fill="#ef4444"/>
  <circle cx="68" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="45" fill="#94a3b8" font-size="13" font-family="monospace">JavaBank — Spring Boot Core Banking Microservice</text>
  <rect x="650" y="28" width="105" height="24" rx="4" fill="#5382A1"/>
  <text x="662" y="44" fill="#ffffff" font-size="11" font-weight="bold">Spring Boot</text>

  <!-- Left: Endpoints & Swagger Mock -->
  <g transform="translate(40, 80)">
    <rect width="340" height="365" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="bold">RESTful Banking Endpoints</text>

    <!-- GET /accounts -->
    <g transform="translate(20, 60)">
      <rect width="300" height="42" rx="6" fill="#1e293b"/>
      <rect x="10" y="10" width="45" height="22" rx="4" fill="#10b981"/>
      <text x="18" y="25" fill="#ffffff" font-size="11" font-weight="bold">GET</text>
      <text x="68" y="26" fill="#f8fafc" font-size="12" font-family="monospace">/api/v1/accounts</text>
    </g>

    <!-- POST /accounts/{id}/transfer -->
    <g transform="translate(20, 115)">
      <rect width="300" height="42" rx="6" fill="#1e293b"/>
      <rect x="10" y="10" width="52" height="22" rx="4" fill="#3b82f6"/>
      <text x="16" y="25" fill="#ffffff" font-size="11" font-weight="bold">POST</text>
      <text x="72" y="26" fill="#f8fafc" font-size="12" font-family="monospace">/transfer</text>
    </g>

    <!-- POST /deposit -->
    <g transform="translate(20, 170)">
      <rect width="300" height="42" rx="6" fill="#1e293b"/>
      <rect x="10" y="10" width="52" height="22" rx="4" fill="#3b82f6"/>
      <text x="16" y="25" fill="#ffffff" font-size="11" font-weight="bold">POST</text>
      <text x="72" y="26" fill="#f8fafc" font-size="12" font-family="monospace">/deposit</text>
    </g>

    <!-- Live Status -->
    <g transform="translate(20, 235)">
      <rect width="300" height="95" rx="8" fill="#1e293b"/>
      <text x="15" y="28" fill="#94a3b8" font-size="12">ACID Transaction Validation</text>
      <text x="15" y="55" fill="#34d399" font-size="20" font-weight="bold">100% Guaranteed</text>
      <text x="15" y="80" fill="#64748b" font-size="11">Atomic transfers with overdraft protection</text>
    </g>
  </g>

  <!-- Right: Java Spring Code Architecture -->
  <g transform="translate(410, 80)">
    <rect width="350" height="365" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="bold">Service Layer &amp; Data Model</text>

    <g transform="translate(20, 60)" font-family="monospace" font-size="12">
      <text x="0" y="20" fill="#f59e0b">@Transactional</text>
      <text x="0" y="45" fill="#f43f5e">public void <tspan fill="#60a5fa">transferFunds</tspan>(TransferDTO req) {</text>
      <text x="15" y="70" fill="#e2e8f0">Account from = findAccount(req.getFrom());</text>
      <text x="15" y="95" fill="#e2e8f0">Account to = findAccount(req.getTo());</text>
      
      <text x="15" y="130" fill="#10b981">// Atomic balance adjustment</text>
      <text x="15" y="155" fill="#e2e8f0">from.debit(req.getAmount());</text>
      <text x="15" y="180" fill="#e2e8f0">to.credit(req.getAmount());</text>

      <text x="15" y="215" fill="#e2e8f0">accountRepository.saveAll(List.of(from, to));</text>
      <text x="0" y="240" fill="#f43f5e">}</text>
    </g>
  </g>
</svg>


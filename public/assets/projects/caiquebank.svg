<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="caiqueBankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#121e38"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#caiqueBankBg)"/>

  <rect x="25" y="20" width="750" height="40" rx="8" fill="#1e293b"/>
  <circle cx="50" cy="40" r="5" fill="#ef4444"/>
  <circle cx="68" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="45" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">CaiqueBank — Digital Banking SPA Interface</text>

  <!-- Left: Banking Dashboard Card -->
  <g transform="translate(30, 80)">
    <!-- Credit card graphic -->
    <rect width="320" height="180" rx="16" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="25" y="35" fill="#93c5fd" font-size="12" font-family="monospace">CAIQUEBANK PLATINUM</text>
    <rect x="25" y="55" width="40" height="30" rx="4" fill="#fbbf24"/>
    <text x="25" y="125" fill="#ffffff" font-size="16" font-family="monospace" letter-spacing="2">•••• •••• •••• 4092</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="12">CAIQUE ALVES</text>
    <text x="240" y="155" fill="#cbd5e1" font-size="12">08/29</text>

    <!-- Account balance card -->
    <g transform="translate(0, 200)">
      <rect width="320" height="160" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="30" fill="#94a3b8" font-size="12">Available Total Balance</text>
      <text x="20" y="65" fill="#ffffff" font-size="28" font-weight="bold">$24,850.00</text>
      
      <g transform="translate(20, 90)">
        <rect width="130" height="36" rx="6" fill="#3b82f6"/>
        <text x="32" y="23" fill="#ffffff" font-size="12" font-weight="bold">Transfer</text>

        <rect x="145" width="130" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="180" y="23" fill="#cbd5e1" font-size="12" font-weight="bold">Statement</text>
      </g>
    </g>
  </g>

  <!-- Right: Recent Transactions List -->
  <g transform="translate(390, 80)">
    <rect width="380" height="360" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="16" font-weight="bold">Recent Ledger Transactions</text>

    <!-- Tx 1 -->
    <g transform="translate(25, 60)">
      <circle cx="20" cy="20" r="16" fill="#10b981" opacity="0.2"/>
      <text x="13" y="25" fill="#10b981" font-size="15">↓</text>
      <text x="50" y="16" fill="#ffffff" font-size="13" font-weight="bold">Direct Deposit Payroll</text>
      <text x="50" y="32" fill="#64748b" font-size="11">Today, 09:30 AM • External Wire</text>
      <text x="250" y="24" fill="#34d399" font-size="14" font-weight="bold">+$4,200.00</text>
    </g>

    <!-- Tx 2 -->
    <g transform="translate(25, 125)">
      <circle cx="20" cy="20" r="16" fill="#ef4444" opacity="0.2"/>
      <text x="13" y="25" fill="#ef4444" font-size="15">↑</text>
      <text x="50" y="16" fill="#ffffff" font-size="13" font-weight="bold">AWS Cloud Services</text>
      <text x="50" y="32" fill="#64748b" font-size="11">Yesterday • Subscription</text>
      <text x="255" y="24" fill="#f87171" font-size="14" font-weight="bold">-$148.20</text>
    </g>

    <!-- Tx 3 -->
    <g transform="translate(25, 190)">
      <circle cx="20" cy="20" r="16" fill="#ef4444" opacity="0.2"/>
      <text x="13" y="25" fill="#ef4444" font-size="15">↑</text>
      <text x="50" y="16" fill="#ffffff" font-size="13" font-weight="bold">Tech Store Purchase</text>
      <text x="50" y="32" fill="#64748b" font-size="11">Oct 18 • POS Debit</text>
      <text x="255" y="24" fill="#f87171" font-size="14" font-weight="bold">-$89.90</text>
    </g>

    <!-- Highlights -->
    <g transform="translate(25, 260)">
      <rect width="330" height="70" rx="8" fill="#1e293b"/>
      <text x="15" y="25" fill="#93c5fd" font-size="12" font-weight="bold">Built with React SPA &amp; REST Consumer</text>
      <text x="15" y="45" fill="#94a3b8" font-size="11">Simulates real-time banking operations and balance mutations.</text>
    </g>
  </g>
</svg>


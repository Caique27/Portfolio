<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#24140e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#foodBg)"/>

  <!-- Left: Mobile food app device frame -->
  <g transform="translate(60, 40)">
    <rect width="250" height="400" rx="30" fill="#0f172a" stroke="#ea580c" stroke-width="2"/>
    <rect x="85" y="10" width="80" height="16" rx="8" fill="#1e293b"/>
    
    <text x="25" y="55" fill="#f8fafc" font-size="16" font-family="sans-serif" font-weight="bold">FoodBox Delivery</text>
    <text x="25" y="72" fill="#94a3b8" font-size="11">Fast &amp; Fresh at your doorstep</text>

    <!-- Food Item Card 1 -->
    <rect x="20" y="90" width="210" height="70" rx="10" fill="#1e293b"/>
    <circle cx="55" cy="125" r="22" fill="#ea580c" opacity="0.3"/>
    <text x="44" y="132" font-size="20">🍔</text>
    <text x="90" y="118" fill="#ffffff" font-size="13" font-weight="bold">Classic Smash Burger</text>
    <text x="90" y="136" fill="#ea580c" font-size="12" font-weight="bold">$12.50 • 25 min</text>

    <!-- Food Item Card 2 -->
    <rect x="20" y="170" width="210" height="70" rx="10" fill="#1e293b"/>
    <circle cx="55" cy="205" r="22" fill="#ea580c" opacity="0.3"/>
    <text x="44" y="212" font-size="20">🍕</text>
    <text x="90" y="198" fill="#ffffff" font-size="13" font-weight="bold">Artisan Pepperoni</text>
    <text x="90" y="216" fill="#ea580c" font-size="12" font-weight="bold">$16.00 • 35 min</text>

    <!-- Checkout Cart CTA Button -->
    <rect x="20" y="325" width="210" height="45" rx="12" fill="#ea580c"/>
    <text x="75" y="353" fill="#ffffff" font-size="13" font-weight="bold">Checkout ($28.50)</text>
  </g>

  <!-- Right: Delivery Tracking & Order Features -->
  <g transform="translate(360, 40)">
    <rect width="380" height="190" rx="16" fill="#1e293b"/>
    <text x="25" y="35" fill="#f8fafc" font-size="16" font-weight="bold">Live Courier Tracking &amp; Dispatch</text>
    <text x="25" y="55" fill="#94a3b8" font-size="12">Real-time status updates via WebSockets</text>

    <!-- Delivery Timeline steps -->
    <g transform="translate(25, 85)">
      <circle cx="15" cy="15" r="12" fill="#10b981"/>
      <text x="11" y="19" fill="#ffffff" font-size="11">✓</text>
      <text x="38" y="18" fill="#ffffff" font-size="13" font-weight="bold">Order Placed &amp; Confirmed</text>

      <line x1="15" y1="27" x2="15" y2="50" stroke="#10b981" stroke-width="2"/>

      <circle cx="15" cy="62" r="12" fill="#f59e0b"/>
      <text x="10" y="66" fill="#ffffff" font-size="11">⚙</text>
      <text x="38" y="65" fill="#f59e0b" font-size="13" font-weight="bold">Kitchen Preparing Food</text>
    </g>

    <!-- Bottom Features -->
    <g transform="translate(0, 210)">
      <rect width="380" height="190" rx="16" fill="#1e293b"/>
      <text x="25" y="35" fill="#f8fafc" font-size="16" font-weight="bold">Architecture &amp; Features</text>
      <g transform="translate(25, 65)">
        <text x="0" y="15" fill="#cbd5e1" font-size="13">• React Native &amp; React responsive interface</text>
        <text x="0" y="45" fill="#cbd5e1" font-size="13">• Modular components for menu and cart items</text>
        <text x="0" y="75" fill="#cbd5e1" font-size="13">• Dynamic pricing calculation and tax summary</text>
        <text x="0" y="105" fill="#cbd5e1" font-size="13">• Smooth mobile-friendly touch interactions</text>
      </g>
    </g>
  </g>
</svg>


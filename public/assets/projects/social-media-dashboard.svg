<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg3)"/>
  
  <!-- Sidebar -->
  <rect x="20" y="20" width="60" height="440" rx="8" fill="#1e293b" opacity="0.6"/>
  <circle cx="50" cy="50" r="14" fill="#38bdf8"/>
  <rect x="35" y="90" width="30" height="8" rx="2" fill="#64748b"/>
  <rect x="35" y="120" width="30" height="8" rx="2" fill="#64748b"/>
  <rect x="35" y="150" width="30" height="8" rx="2" fill="#38bdf8"/>
  <rect x="35" y="180" width="30" height="8" rx="2" fill="#64748b"/>

  <!-- Top Metric Cards -->
  <g transform="translate(100, 20)">
    <rect width="210" height="95" rx="8" fill="#1e293b"/>
    <rect x="20" y="20" width="80" height="10" rx="2" fill="#94a3b8"/>
    <text x="20" y="62" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="bold">128.4K</text>
    <rect x="140" y="20" width="50" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="148" y="34" fill="#34d399" font-size="12" font-family="sans-serif" font-weight="bold">+14.2%</text>
  </g>

  <g transform="translate(330, 20)">
    <rect width="210" height="95" rx="8" fill="#1e293b"/>
    <rect x="20" y="20" width="90" height="10" rx="2" fill="#94a3b8"/>
    <text x="20" y="62" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="bold">94.8%</text>
    <rect x="140" y="20" width="50" height="20" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="148" y="34" fill="#60a5fa" font-size="12" font-family="sans-serif" font-weight="bold">+8.6%</text>
  </g>

  <g transform="translate(560, 20)">
    <rect width="210" height="95" rx="8" fill="#1e293b"/>
    <rect x="20" y="20" width="85" height="10" rx="2" fill="#94a3b8"/>
    <text x="20" y="62" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="bold">$42.9K</text>
    <rect x="140" y="20" width="50" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="148" y="34" fill="#34d399" font-size="12" font-family="sans-serif" font-weight="bold">+21.4%</text>
  </g>

  <!-- Big Interactive Chart -->
  <g transform="translate(100, 135)">
    <rect width="440" height="325" rx="10" fill="#1e293b"/>
    <rect x="25" y="25" width="130" height="14" rx="2" fill="#f8fafc"/>
    <rect x="25" y="45" width="200" height="10" rx="2" fill="#64748b"/>
    
    <!-- Grid lines -->
    <line x1="25" y1="100" x2="415" y2="100" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="25" y1="160" x2="415" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="25" y1="220" x2="415" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="25" y1="280" x2="415" y2="280" stroke="#334155" stroke-width="1"/>

    <!-- Area chart fill -->
    <path d="M 30 250 Q 80 230, 130 170 T 230 190 T 320 120 T 410 80 L 410 280 L 30 280 Z" fill="url(#lineGrad)"/>
    <path d="M 30 250 Q 80 230, 130 170 T 230 190 T 320 120 T 410 80" fill="none" stroke="#38bdf8" stroke-width="3"/>

    <!-- Pulse point -->
    <circle cx="320" cy="120" r="6" fill="#38bdf8"/>
    <circle cx="320" cy="120" r="12" fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- Side distribution donut & stats -->
  <g transform="translate(560, 135)">
    <rect width="210" height="325" rx="10" fill="#1e293b"/>
    <rect x="20" y="25" width="110" height="14" rx="2" fill="#f8fafc"/>
    <rect x="20" y="45" width="140" height="10" rx="2" fill="#64748b"/>

    <!-- Donut representation -->
    <circle cx="105" cy="150" r="60" fill="none" stroke="#0f172a" stroke-width="20"/>
    <circle cx="105" cy="150" r="60" fill="none" stroke="#3b82f6" stroke-width="20" stroke-dasharray="210 380"/>
    <circle cx="105" cy="150" r="60" fill="none" stroke="#10b981" stroke-width="20" stroke-dasharray="90 380" stroke-dashoffset="-210"/>
    <circle cx="105" cy="150" r="60" fill="none" stroke="#f59e0b" stroke-width="20" stroke-dasharray="60 380" stroke-dashoffset="-300"/>

    <!-- Legend -->
    <circle cx="30" cy="245" r="5" fill="#3b82f6"/>
    <rect x="45" y="240" width="70" height="10" rx="2" fill="#94a3b8"/>
    <text x="160" y="249" fill="#cbd5e1" font-size="12" font-family="sans-serif">58%</text>

    <circle cx="30" cy="270" r="5" fill="#10b981"/>
    <rect x="45" y="265" width="60" height="10" rx="2" fill="#94a3b8"/>
    <text x="160" y="274" fill="#cbd5e1" font-size="12" font-family="sans-serif">26%</text>

    <circle cx="30" cy="295" r="5" fill="#f59e0b"/>
    <rect x="45" y="290" width="50" height="10" rx="2" fill="#94a3b8"/>
    <text x="160" y="299" fill="#cbd5e1" font-size="12" font-family="sans-serif">16%</text>
  </g>
</svg>


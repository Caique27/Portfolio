<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="titanicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1729"/>
      <stop offset="100%" stop-color="#142642"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#titanicBg)"/>
  <!-- Top bar -->
  <rect x="25" y="20" width="750" height="40" rx="8" fill="#1e293b"/>
  <circle cx="50" cy="40" r="5" fill="#ef4444"/>
  <circle cx="68" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="40" r="5" fill="#10b981"/>
  <rect x="120" y="32" width="260" height="16" rx="4" fill="#334155"/>
  <rect x="670" y="28" width="85" height="24" rx="5" fill="#f59e0b"/>
  <text x="682" y="44" fill="#000" font-size="11" font-weight="bold">Jupyter</text>

  <!-- Left: Correlation Matrix & Stats -->
  <g transform="translate(25, 75)">
    <rect width="365" height="380" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="16" font-weight="bold">Passenger Survival Analysis</text>
    <text x="25" y="55" fill="#94a3b8" font-size="12">Correlation: Class, Sex, Age vs Survival</text>

    <!-- Heatmap matrix simulation -->
    <g transform="translate(25, 80)">
      <rect x="0" y="0" width="70" height="70" rx="4" fill="#1e3a8a"/>
      <text x="22" y="40" fill="#93c5fd" font-size="12">0.54</text>

      <rect x="75" y="0" width="70" height="70" rx="4" fill="#1e40af"/>
      <text x="97" y="40" fill="#bfdbfe" font-size="12">-0.34</text>

      <rect x="150" y="0" width="70" height="70" rx="4" fill="#3b82f6"/>
      <text x="172" y="40" fill="#ffffff" font-size="12">0.26</text>

      <rect x="225" y="0" width="70" height="70" rx="4" fill="#2563eb"/>
      <text x="247" y="40" fill="#ffffff" font-size="12">-0.08</text>

      <!-- Row 2 -->
      <rect x="0" y="75" width="70" height="70" rx="4" fill="#1e40af"/>
      <text x="22" y="115" fill="#bfdbfe" font-size="12">-0.34</text>

      <rect x="75" y="75" width="70" height="70" rx="4" fill="#1d4ed8"/>
      <text x="97" y="115" fill="#ffffff" font-size="12">1.00</text>

      <rect x="150" y="75" width="70" height="70" rx="4" fill="#60a5fa"/>
      <text x="172" y="115" fill="#1e293b" font-size="12">-0.37</text>

      <rect x="225" y="75" width="70" height="70" rx="4" fill="#3b82f6"/>
      <text x="247" y="115" fill="#ffffff" font-size="12">0.13</text>
    </g>

    <!-- Model Accuracy Badge -->
    <g transform="translate(25, 260)">
      <rect width="315" height="85" rx="8" fill="#1e293b"/>
      <text x="20" y="30" fill="#94a3b8" font-size="12">Random Forest &amp; Logistic Regression</text>
      <text x="20" y="60" fill="#34d399" font-size="24" font-weight="bold">82.4% Accuracy</text>
    </g>
  </g>

  <!-- Right: Feature Importance Bar Chart -->
  <g transform="translate(410, 75)">
    <rect width="365" height="380" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="16" font-weight="bold">Key Predictive Factors</text>
    <text x="25" y="55" fill="#94a3b8" font-size="12">Gini Importance Index</text>

    <g transform="translate(25, 90)">
      <text x="0" y="15" fill="#cbd5e1" font-size="13">Sex (Female/Male)</text>
      <rect x="0" y="25" width="315" height="18" rx="4" fill="#1e293b"/>
      <rect x="0" y="25" width="260" height="18" rx="4" fill="#38bdf8"/>

      <text x="0" y="75" fill="#cbd5e1" font-size="13">Passenger Class (Pclass)</text>
      <rect x="0" y="85" width="315" height="18" rx="4" fill="#1e293b"/>
      <rect x="0" y="85" width="190" height="18" rx="4" fill="#3b82f6"/>

      <text x="0" y="135" fill="#cbd5e1" font-size="13">Fare Paid</text>
      <rect x="0" y="145" width="315" height="18" rx="4" fill="#1e293b"/>
      <rect x="0" y="145" width="140" height="18" rx="4" fill="#60a5fa"/>

      <text x="0" y="195" fill="#cbd5e1" font-size="13">Age</text>
      <rect x="0" y="205" width="315" height="18" rx="4" fill="#1e293b"/>
      <rect x="0" y="205" width="105" height="18" rx="4" fill="#93c5fd"/>
    </g>
  </g>
</svg>


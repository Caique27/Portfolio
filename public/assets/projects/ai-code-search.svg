<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#141126"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#aiBg)"/>

  <!-- Search input bar -->
  <g transform="translate(40, 30)">
    <rect width="720" height="52" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="35" cy="26" r="10" fill="#818cf8" opacity="0.3"/>
    <text x="30" y="30" fill="#a5b4fc" font-size="14">🔍</text>
    <text x="65" y="32" fill="#f8fafc" font-size="15" font-family="monospace">find distributed lock implementations with TTL fallback in Redis</text>
    <rect x="635" y="14" width="70" height="24" rx="6" fill="#6366f1"/>
    <text x="647" y="30" fill="#ffffff" font-size="11" font-weight="bold">Search</text>
  </g>

  <!-- Query Analysis / Vector embedding breakdown -->
  <g transform="translate(40, 100)">
    <rect width="720" height="70" rx="10" fill="#1e293b" opacity="0.6"/>
    <text x="25" y="25" fill="#a5b4fc" font-size="12" font-family="monospace">EMBEDDING MODEL: text-embedding-3-large (3072 dims) • COSINE SIMILARITY THRESHOLD: > 0.88</text>
    <!-- Vector chips -->
    <g transform="translate(25, 36)">
      <rect width="130" height="22" rx="4" fill="#312e81"/>
      <text x="10" y="15" fill="#c7d2fe" font-size="11" font-family="monospace">tag: #distributed-lock</text>

      <rect x="140" width="100" height="22" rx="4" fill="#312e81"/>
      <text x="150" y="15" fill="#c7d2fe" font-size="11" font-family="monospace">ast: #mutex-ttl</text>

      <rect x="250" width="130" height="22" rx="4" fill="#065f46"/>
      <text x="260" y="15" fill="#a7f3d0" font-size="11" font-family="monospace">top_match: 97.4%</text>

      <rect x="390" width="160" height="22" rx="4" fill="#1e293b"/>
      <text x="400" y="15" fill="#94a3b8" font-size="11" font-family="monospace">latency: 18ms (Pinecone)</text>
    </g>
  </g>

  <!-- Semantic Match 1 -->
  <g transform="translate(40, 190)">
    <rect width="720" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="15" width="260" height="22" rx="4" fill="#0f172a"/>
    <text x="30" y="30" fill="#38bdf8" font-size="12" font-family="monospace">packages/cache/src/redis-lock.ts:L42-L78</text>
    <rect x="630" y="15" width="70" height="22" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="642" y="30" fill="#34d399" font-size="11" font-weight="bold">97.4% score</text>

    <!-- Code excerpt -->
    <g transform="translate(20, 50)" font-family="monospace" font-size="12">
      <text x="0" y="15" fill="#f43f5e">async acquireLock(key: string, ttlMs = 5000): Promise&lt;LockToken&gt; {</text>
      <text x="20" y="35" fill="#e2e8f0">const token = crypto.randomUUID();</text>
      <text x="20" y="55" fill="#60a5fa">const result = await this.redis.set(key, token, 'PX', ttlMs, 'NX');</text>
      <text x="20" y="75" fill="#10b981">if (!result) throw new LockAcquisitionError('Resource currently locked');</text>
    </g>
  </g>

  <!-- Semantic Match 2 -->
  <g transform="translate(40, 335)">
    <rect width="720" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="15" width="280" height="22" rx="4" fill="#0f172a"/>
    <text x="30" y="30" fill="#38bdf8" font-size="12" font-family="monospace">services/billing/workers/checkout-queue.ts:L95</text>
    <rect x="630" y="15" width="70" height="22" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="642" y="30" fill="#34d399" font-size="11" font-weight="bold">92.1% score</text>

    <!-- Code excerpt -->
    <g transform="translate(20, 50)" font-family="monospace" font-size="12">
      <text x="0" y="15" fill="#f43f5e">await withDistributedLock(`checkout:${cartId}`, async () => {</text>
      <text x="20" y="35" fill="#e2e8f0">return await processStripePaymentIdempotent(cartId, token);</text>
      <text x="0" y="55" fill="#f43f5e">});</text>
    </g>
  </g>
